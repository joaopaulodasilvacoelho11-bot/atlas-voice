<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas Voice — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root {
  --bg-deep: #02040a;
  --bg-mid: #061229;
  --bg-violet: #1a0b3a;
  --cyan: #4dd9ff;
  --cyan-bright: #9eeaff;
  --cyan-soft: #2a78a8;
  --amber: #ffb547;
  --amber-bright: #ffe1a8;
  --lyra: #b45aff;
  --lyra-bright: #d4a0ff;
  --line: rgba(157,220,255,0.18);
  --line-strong: rgba(157,220,255,0.45);
  --text: #d8e8ff;
  --text-dim: rgba(216,232,255,0.55);
  --text-faint: rgba(157,195,235,0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#root{height:100%}

/* ── App shell ── */
.app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000;isolation:isolate}

/* ── Nebula ── */
.nebula{position:absolute;inset:0;z-index:0;overflow:hidden}
.nebula-layer{position:absolute;inset:-10%;mix-blend-mode:screen}
.nebula-layer--base{
  background:
    radial-gradient(ellipse 80% 60% at 30% 20%,#0a2e6e 0%,transparent 60%),
    radial-gradient(ellipse 70% 70% at 75% 75%,#1a0b3a 0%,transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%,#050c20 0%,#02040a 80%);
  mix-blend-mode:normal}
.nebula-layer--violet{
  background:
    radial-gradient(ellipse 50% 40% at 80% 30%,rgba(120,60,200,.55),transparent 65%),
    radial-gradient(ellipse 40% 35% at 20% 75%,rgba(80,40,170,.45),transparent 70%);
  filter:blur(20px)}
.nebula-layer--amber{
  background:
    radial-gradient(ellipse 40% 30% at 85% 60%,rgba(255,140,60,.42),transparent 65%),
    radial-gradient(ellipse 25% 20% at 15% 35%,rgba(255,170,80,.18),transparent 70%);
  filter:blur(30px)}
.nebula-layer--cyan{
  background:
    radial-gradient(ellipse 60% 40% at 50% 50%,rgba(60,180,255,.28),transparent 70%),
    radial-gradient(ellipse 30% 25% at 25% 25%,rgba(100,200,255,.35),transparent 65%);
  filter:blur(40px)}
.nebula-stars{position:absolute;inset:0}
.star{position:absolute;background:#cfe9ff;border-radius:50%;box-shadow:0 0 4px #9eeaff}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.nebula-grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.6 0 0 0 0 1 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.4'/></svg>")}

/* ── HUD frame ── */
.hud-frame{position:absolute;inset:0;z-index:5;pointer-events:none}
.hud-corner{position:absolute;width:28px;height:28px;border-color:var(--line-strong);border-style:solid;border-width:0}
.hud-corner--tl{top:22px;left:22px;border-top-width:1px;border-left-width:1px}
.hud-corner--tr{top:22px;right:22px;border-top-width:1px;border-right-width:1px}
.hud-corner--bl{bottom:22px;left:22px;border-bottom-width:1px;border-left-width:1px}
.hud-corner--br{bottom:22px;right:22px;border-bottom-width:1px;border-right-width:1px}
.hud-edge{position:absolute;left:50%;transform:translateX(-50%);width:220px;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-strong) 20%,var(--line-strong) 80%,transparent)}
.hud-edge--t{top:22px}.hud-edge--b{bottom:22px}
.hud-bracket{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:120px;border:1px solid var(--line);border-radius:2px}
.hud-bracket--l{left:22px;border-right:none}.hud-bracket--r{right:22px;border-left:none}

/* ── Topbar ── */
.topbar{position:relative;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:28px 56px 0;gap:24px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(20,50,100,.25);backdrop-filter:blur(6px);box-shadow:0 0 24px rgba(77,217,255,.25)}
.brand-text h1{font-family:'Orbitron',sans-serif;font-weight:700;font-size:26px;letter-spacing:.32em;background:linear-gradient(180deg,#e6f5ff 0%,#4dd9ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.brand-text h1.lyra-title{background:linear-gradient(180deg,#ead4ff 0%,#b45aff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-text p{margin:2px 0 0;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.32em;color:var(--text-faint)}
.clock{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 28px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,rgba(10,30,70,.45),rgba(10,30,70,.15));backdrop-filter:blur(8px);box-shadow:inset 0 0 24px rgba(77,217,255,.08),0 0 32px rgba(77,217,255,.12)}
.clock-time{font-family:'Orbitron',monospace;font-weight:500;font-size:32px;letter-spacing:.06em;color:var(--cyan-bright);text-shadow:0 0 18px rgba(77,217,255,.6);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:2px}
.clock-time .ss{font-size:16px;margin-left:8px;color:var(--text-dim);text-shadow:none}
.clock-time .colon{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.clock-date{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.28em;color:var(--text-faint)}
.presence-btn{justify-self:end;align-self:start;margin-top:-4px;display:flex;align-items:center;gap:12px;padding:10px 20px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.24em;font-weight:500;color:var(--cyan-bright);background:linear-gradient(180deg,rgba(77,217,255,.12),rgba(77,217,255,.04));border:1px solid var(--line-strong);border-radius:4px;cursor:pointer;transition:all .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 20px rgba(77,217,255,.15)}
.presence-btn:hover{background:linear-gradient(180deg,rgba(77,217,255,.22),rgba(77,217,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 32px rgba(77,217,255,.3);transform:translateY(-1px)}
.presence-btn-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse-dot 1.6s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.7)}}
.presence-btn-chev{font-size:16px;opacity:.6;line-height:1}

/* ── Sides ── */
.side{position:absolute;z-index:12;display:flex;flex-direction:column;gap:10px;padding:12px 16px;width:152px;top:80px;bottom:130px;overflow:hidden}
.side--left{left:56px;align-items:flex-start;transition:left .35s cubic-bezier(.4,0,.2,1)}
.hist-open .side--left{left:276px;z-index:7999}
.side--right{right:56px;align-items:flex-end}
.side-stat{display:flex;flex-direction:row;align-items:baseline;gap:8px;font-family:'JetBrains Mono',monospace}
.side--right .side-stat{justify-content:flex-end}
.side-stat-label{font-size:9px;letter-spacing:.18em;color:var(--text-faint);white-space:nowrap}
.side-stat-value{font-size:14px;font-weight:500;color:var(--cyan-bright);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(77,217,255,.4);white-space:nowrap;line-height:1}
.side-stat-unit{font-size:11px;margin-left:4px;color:var(--text-dim);text-shadow:none;font-weight:400}
.side-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:4px 0}
.side-channel{width:100%}
.side-channel-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.24em;color:var(--text-faint);margin-bottom:6px}
.side--right .side-channel-label{text-align:right}
.side-channel-bars{display:flex;gap:3px;height:22px;align-items:flex-end}
.side--right .side-channel-bars{justify-content:flex-end}
.ch-bar{width:4px;background:linear-gradient(180deg,var(--cyan-bright),var(--cyan));border-radius:1px;box-shadow:0 0 6px var(--cyan);height:calc(20% + (var(--i) % 4) * 18%);animation:ch-pulse 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * 0.08s)}
@keyframes ch-pulse{0%,100%{transform:scaleY(.5);opacity:.6}50%{transform:scaleY(1.2);opacity:1}}

/* ── Presence status (right panel) ── */
.presence-status{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.side--right .presence-status{align-items:flex-end}
.side--right .presence-name{justify-content:flex-end}
.presence-name{display:flex;align-items:center;gap:6px;font-family:'Orbitron',sans-serif;flex-wrap:nowrap}
.pname-btn{background:transparent;border:1px solid rgba(255,255,255,.10);color:rgba(220,235,255,.45);font-family:inherit;font-size:9px;font-weight:500;letter-spacing:.16em;padding:3px 7px;border-radius:2px;cursor:pointer;white-space:nowrap;transition:color 160ms,border-color 160ms,background 160ms,box-shadow 160ms}
.pname-btn:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.22)}
.pname-btn.active-atlas{color:#4dd9ff;border-color:rgba(77,217,255,.5);background:rgba(77,217,255,.08)}
.pname-btn.active-lyra{color:#c98aff;border-color:rgba(180,90,255,.55);background:rgba(180,90,255,.10)}
.pname-divider{width:1px;height:10px;background:rgba(255,255,255,.18)}
.presence-sphere-canvas{display:block;margin:-8px 0;pointer-events:none}
.presence-status-label{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.28em;color:var(--cyan-bright)}

/* ── Stage (center) ── */
.stage{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:1600px}

/* ── Nucleus (center visual) ── */
.nucleus-wrap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:420px;height:420px;display:flex;align-items:center;justify-content:center}
.nucleus-canvas{display:block;pointer-events:none;width:100%!important;height:100%!important}

/* ── Waveform ── */
.waveform{position:absolute;left:50%;transform:translateX(-50%);top:calc(50% - 58% * 340px / 100 + 190px);display:flex;gap:2px;width:320px;height:36px;align-items:center;justify-content:center;opacity:.75;pointer-events:none}
.wf-bar{width:2px;background:linear-gradient(180deg,var(--cyan-bright),var(--cyan));border-radius:1px;height:4px;box-shadow:0 0 6px var(--cyan)}
.waveform.is-active .wf-bar{animation:wf-pulse 1.6s ease-in-out infinite}
@keyframes wf-pulse{0%,100%{height:4px;opacity:.4}50%{height:calc(8px + (var(--i) % 7) * 4px);opacity:1}}

/* ── Transcript ── */
.transcript{position:absolute;left:50%;transform:translateX(-50%);bottom:140px;width:min(680px,55vw);display:flex;flex-direction:column;gap:8px;z-index:9;pointer-events:none}
.msg{display:flex;align-items:baseline;gap:12px;padding:8px 16px;background:linear-gradient(90deg,rgba(10,30,70,.5),rgba(10,30,70,.15));border-left:1px solid var(--line-strong);backdrop-filter:blur(6px);font-size:14px;color:var(--text);animation:msg-in .4s ease-out}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-tag{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.24em;color:var(--cyan);flex-shrink:0;width:48px}
.msg--you .msg-tag{color:var(--amber)}
.msg--lyra .msg-tag{color:var(--lyra-bright)}
.msg-text{line-height:1.5;white-space:pre-wrap}
.dot-pulse{display:inline-flex;gap:4px}
.dock-typing{display:flex;align-items:center;gap:3px;padding:0 8px}
.dock-typing span{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:dock-dot 1.2s ease-in-out infinite}
.dock-typing span:nth-child(2){animation-delay:.2s}
.dock-typing span:nth-child(3){animation-delay:.4s}
@keyframes dock-dot{0%,100%{opacity:.2;transform:scale(.6) translateY(0)}50%{opacity:1;transform:scale(1.1) translateY(-3px)}}
.dot-pulse i{width:6px;height:6px;border-radius:50%;background:var(--cyan-bright);box-shadow:0 0 6px var(--cyan-bright);animation:dot 1s ease-in-out infinite}
.dot-pulse i:nth-child(2){animation-delay:.15s}
.dot-pulse i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}

/* ── Dock ── */
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:36px;width:min(820px,72vw);z-index:10}
.dock-frame{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;background:linear-gradient(180deg,rgba(10,28,60,.7),rgba(8,18,40,.6));border:1px solid var(--line-strong);border-radius:8px;backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(77,217,255,.05),0 0 32px rgba(77,217,255,.18),0 16px 48px rgba(0,0,0,.6);position:relative}
.dock-frame::before{content:"";position:absolute;inset:-1px;border-radius:8px;background:linear-gradient(135deg,var(--cyan) 0%,transparent 25%,transparent 75%,var(--amber) 100%);opacity:.4;z-index:-1;filter:blur(.5px)}
.dock-icon{width:36px;height:36px;border:1px solid var(--line);background:rgba(77,217,255,.06);color:var(--cyan-bright);border-radius:6px;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.dock-icon:hover{background:rgba(77,217,255,.16);border-color:var(--cyan);box-shadow:0 0 16px rgba(77,217,255,.4)}
.dock-prompt{font-family:'Orbitron',monospace;font-size:18px;color:var(--cyan);text-shadow:0 0 8px var(--cyan);line-height:1}
.dock-input{flex:1;height:36px;background:transparent;border:0;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;letter-spacing:.01em;caret-color:var(--cyan-bright)}
.dock-input::placeholder{color:var(--text-faint);font-style:italic}
.dock-meta{display:flex;align-items:center;gap:10px;padding-right:6px}
.dock-counter{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:.1em}
.dock-send{display:flex;align-items:center;gap:8px;height:36px;padding:0 18px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.24em;font-weight:600;color:#021018;background:linear-gradient(180deg,var(--cyan-bright),var(--cyan));border:none;border-radius:6px;cursor:pointer;box-shadow:0 0 18px rgba(77,217,255,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:all .15s}
.dock-send:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 0 28px rgba(77,217,255,.8),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-1px)}
.dock-send:disabled{opacity:.4;cursor:default;background:linear-gradient(180deg,#4d6680,#324860);color:rgba(255,255,255,.5);box-shadow:none}
.dock-hint{display:flex;gap:18px;justify-content:center;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:.1em}
.dock-hint kbd{display:inline-block;padding:1px 5px;background:rgba(77,217,255,.1);border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:9px;color:var(--cyan-bright);margin:0 2px}

/* ── History Panel ── */
.hist-btn{position:fixed;right:16px;bottom:56px;z-index:9999;display:flex;align-items:center;gap:7px;padding:8px 14px;background:rgba(10,28,60,.85);border:1px solid rgba(77,217,255,.4);color:#4dd9ff;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.2em;border-radius:6px;cursor:pointer;transition:all .2s}
.hist-btn:hover{background:rgba(77,217,255,.15);box-shadow:0 0 16px rgba(77,217,255,.3)}
.hist-btn.open{background:rgba(77,217,255,.15);border-color:var(--cyan-bright);box-shadow:0 0 16px rgba(77,217,255,.3)}
.hist-panel{position:fixed;top:0;left:0;width:260px;height:100vh;z-index:8000;background:rgba(4,10,28,.96);border-right:1px solid rgba(77,217,255,.25);backdrop-filter:blur(24px);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.hist-panel.open{transform:translateX(0)}
.app.hist-open{width:100vw}
.hist-header{padding:24px 20px 16px;border-bottom:1px solid rgba(77,217,255,.12);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hist-title{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.28em;color:var(--cyan-bright)}
.hist-close{background:transparent;border:1px solid rgba(77,217,255,.2);color:var(--text-dim);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:all .15s}
.hist-close:hover{border-color:var(--cyan);color:var(--cyan-bright);background:rgba(77,217,255,.08)}
.hist-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(77,217,255,.2) transparent}
.hist-messages::-webkit-scrollbar{width:4px}
.hist-messages::-webkit-scrollbar-thumb{background:rgba(77,217,255,.2);border-radius:2px}
.hist-msg{display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:rgba(10,30,70,.35);border-left:1px solid var(--line);border-radius:0 4px 4px 0}
.hist-msg--you{background:rgba(255,181,71,.06);border-left-color:rgba(255,181,71,.35)}
.hist-msg--lyra{border-left-color:rgba(180,90,255,.45)}
.hist-msg-tag{font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:.24em;color:var(--cyan);margin-bottom:2px}
.hist-msg--you .hist-msg-tag{color:var(--amber)}
.hist-msg--lyra .hist-msg-tag{color:var(--lyra-bright)}
.hist-msg-text{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap}
.hist-footer{padding:12px 20px;border-top:1px solid rgba(77,217,255,.12);flex-shrink:0;display:flex;justify-content:center}
.hist-count{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:var(--text-faint)}

/* ── Screensaver ── */
.screensaver-overlay{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.screensaver-overlay.active{opacity:1;pointer-events:all}
.screensaver-overlay .nucleus-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;height:520px}
.screensaver-hint{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.28em;color:rgba(157,195,235,.25);animation:ss-fade 3s ease-in-out infinite}
@keyframes ss-fade{0%,100%{opacity:.3}50%{opacity:.8}}

/* ── Tweaks panel ── */
.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.78);color:#29261b;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
.twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
.twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
.twk-row{display:flex;flex-direction:column;gap:5px}
.twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
.twk-lbl>span:first-child{font-weight:500}
.twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ═══════════════════════════════════════════════
//  NEBULA BACKGROUND
// ═══════════════════════════════════════════════
function Nebula({ variant = "blue-violet" }) {
  const stars = React.useMemo(() => {
    const arr = [];
    for (let i = 0; i < 220; i++) {
      arr.push({
        x: Math.random() * 100, y: Math.random() * 100,
        s: Math.random() * 1.6 + 0.2, o: Math.random() * 0.7 + 0.2,
        tw: Math.random() * 4 + 2, td: Math.random() * 4,
      });
    }
    return arr;
  }, []);
  return (
    <div className={`nebula nebula--${variant}`}>
      <div className="nebula-layer nebula-layer--base" />
      <div className="nebula-layer nebula-layer--violet" />
      <div className="nebula-layer nebula-layer--amber" />
      <div className="nebula-layer nebula-layer--cyan" />
      <div className="nebula-stars">
        {stars.map((s, i) => (
          <span key={i} className="star" style={{
            left:`${s.x}%`,top:`${s.y}%`,
            width:`${s.s}px`,height:`${s.s}px`,opacity:s.o,
            animation:`twinkle ${s.tw}s ease-in-out ${s.td}s infinite`,
          }} />
        ))}
      </div>
      <div className="nebula-grain" />
    </div>
  );
}

// ═══════════════════════════════════════════════
//  PRESENCE SPHERE (right panel)
// ═══════════════════════════════════════════════
const PRESENCE_COLORS = {
  atlas: { rgb:[77,217,255], hex:"#4dd9ff", dim:[60,140,255] },
  lyra:  { rgb:[180,90,255], hex:"#b45aff", dim:[120,60,220] },
};

function PresenceSphere({ state = "listening", presence = "atlas", size = 88 }) {
  const canvasRef = React.useRef(null);
  const stateRef = React.useRef(state);
  const presenceRef = React.useRef(presence);
  React.useEffect(() => { stateRef.current = state; }, [state]);
  React.useEffect(() => { presenceRef.current = presence; }, [presence]);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = size * dpr; canvas.height = size * dpr;
    canvas.style.width = size+"px"; canvas.style.height = size+"px";
    ctx.scale(dpr, dpr);
    const W = size, H = size, cx = W/2, cy = H/2;
    const sonarRings = Array.from({length:5},(_,i)=>({maxR:28+i*6,phase:i*1.2,speed:.4}));
    const thinkRings = Array.from({length:6},(_,i)=>({
      r:6+i*4,angle:Math.random()*Math.PI*2,
      speed:(0.008+i*0.004)*(i%2===0?1:-1),
      alpha:.3+i*.08,lw:.8+i*.2,kind:i%2===0?"primary":"accent"
    }));
    let t=0,last=performance.now(),raf=0;
    const pc=(a)=>{const c=PRESENCE_COLORS[presenceRef.current].rgb;return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
    const pcDim=(a)=>{const c=PRESENCE_COLORS[presenceRef.current].dim;return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
    const pcHex=()=>PRESENCE_COLORS[presenceRef.current].hex;
    function drawSphere(r,pulse,st){
      const coronaR=r*(st==="idle"?1.8:st==="speaking"?3.2:2.5);
      const coronaAlpha=st==="idle"?.06:.18;
      const gc=ctx.createRadialGradient(cx,cy,0,cx,cy,coronaR);
      gc.addColorStop(0,pc(coronaAlpha*pulse));gc.addColorStop(.5,pcDim(coronaAlpha*.5*pulse));gc.addColorStop(1,"transparent");
      ctx.beginPath();ctx.arc(cx,cy,coronaR,0,Math.PI*2);ctx.fillStyle=gc;ctx.fill();
      const br=st==="idle"?.5:1;
      const sg=ctx.createRadialGradient(cx-r*.38,cy-r*.38,.5,cx,cy,r);
      sg.addColorStop(0,`rgba(255,255,255,${br})`);sg.addColorStop(.2,`rgba(220,235,255,${br})`);
      sg.addColorStop(.55,pc(br));sg.addColorStop(.85,`rgba(10,15,60,${br})`);sg.addColorStop(1,`rgba(2,4,16,${br})`);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=sg;ctx.shadowBlur=st==="idle"?6:14;ctx.shadowColor=pcHex();ctx.fill();ctx.shadowBlur=0;
      const hl=ctx.createRadialGradient(cx-r*.42,cy-r*.42,0,cx-r*.42,cy-r*.42,r*.52);
      hl.addColorStop(0,`rgba(255,255,255,${.85*br*pulse})`);hl.addColorStop(1,"transparent");
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
    }
    function drawListening(r,pulse,dt){
      sonarRings.forEach(ring=>{
        ring.phase+=dt*.001;const cycle=(ring.phase*ring.speed)%(Math.PI*2);const progress=cycle/(Math.PI*2);
        const cr=r+progress*ring.maxR;const ca=(1-progress)*.6;
        ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.strokeStyle=pc(ca);ctx.lineWidth=1.2*(1-progress);ctx.shadowBlur=4;ctx.shadowColor=pcHex();ctx.stroke();ctx.shadowBlur=0;
      });
      const breathR=r+2+Math.sin(t*1.4)*1.5;ctx.beginPath();ctx.arc(cx,cy,breathR,0,Math.PI*2);ctx.strokeStyle=pc(.35*pulse);ctx.lineWidth=.8;ctx.stroke();
    }
    function drawSpeaking(r,pulse){
      const pCol=PRESENCE_COLORS[presenceRef.current].rgb.join(",");
      for(let w=0;w<6;w++){
        const wPhase=(t*1.8+w*(1/6)*Math.PI*2)%(Math.PI*2);const progress=wPhase/(Math.PI*2);
        const wR=r+progress*(size*.45);const wA=(1-progress)*(w%2===0?.7:.45);
        const col=w%3===0?`rgba(${pCol},${wA})`:w%3===1?`rgba(255,190,80,${wA*.8})`:`rgba(192,132,252,${wA*.6})`;
        ctx.beginPath();ctx.arc(cx,cy,wR,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=(1-progress)*2;ctx.shadowBlur=6;ctx.shadowColor=col;ctx.stroke();ctx.shadowBlur=0;
      }
      for(let i=0;i<18;i++){
        const angle=(i/18)*Math.PI*2;const a=angle+Math.sin(t*6+i*.8)*.12;
        const len=r+12+Math.sin(t*4+i*1.1)*8;const intensity=.5+Math.sin(t*5+i*.5)*.4;
        const x0=cx+Math.cos(a)*r,y0=cy+Math.sin(a)*r,x1=cx+Math.cos(a)*len,y1=cy+Math.sin(a)*len;
        const grad=ctx.createLinearGradient(x0,y0,x1,y1);
        const col=i%3===0?PRESENCE_COLORS[presenceRef.current].rgb.join(","):i%3===1?"255,190,80":"192,132,252";
        grad.addColorStop(0,`rgba(${col},${.9*intensity*pulse})`);grad.addColorStop(.5,`rgba(${col},${.5*intensity*pulse})`);grad.addColorStop(1,`rgba(${col},0)`);
        ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle=grad;ctx.lineWidth=1+Math.sin(t*4+i)*.4;ctx.shadowBlur=5;ctx.shadowColor=`rgba(${col},.8)`;ctx.stroke();ctx.shadowBlur=0;
      }
      ctx.beginPath();ctx.arc(cx,cy,r+3+Math.sin(t*3)*1.5,0,Math.PI*2);ctx.strokeStyle=`rgba(255,190,80,${.4*pulse})`;ctx.lineWidth=1;ctx.stroke();
    }
    function drawThinking(r,pulse){
      const primaryHex=pcHex();
      thinkRings.forEach(ring=>{
        ring.angle+=ring.speed;const ringCol=ring.kind==="primary"?primaryHex:"#c084fc";
        for(let i=0;i<12;i++){
          const a0=ring.angle+(i/12)*Math.PI*2;const a1=a0+(.6/12)*Math.PI*2;
          ctx.beginPath();ctx.arc(cx,cy,ring.r,a0,a1);ctx.strokeStyle=ringCol;ctx.lineWidth=ring.lw;
          ctx.globalAlpha=ring.alpha*(.5+Math.sin(t*2+i)*.5);ctx.shadowBlur=4;ctx.shadowColor=ringCol;ctx.stroke();ctx.shadowBlur=0;
        }
      });
      ctx.globalAlpha=1;
      const scanAngle=t*3;
      ctx.beginPath();ctx.arc(cx,cy,r+8,scanAngle,scanAngle+Math.PI*.7);ctx.strokeStyle=`rgba(192,132,252,${.8*pulse})`;ctx.lineWidth=1.4;ctx.shadowBlur=6;ctx.shadowColor="#c084fc";ctx.stroke();ctx.shadowBlur=0;
    }
    function drawIdle(r){
      const breathR=r+2+Math.sin(t*.5)*1.5;ctx.beginPath();ctx.arc(cx,cy,breathR,0,Math.PI*2);ctx.strokeStyle=pc(.18);ctx.lineWidth=.6;ctx.stroke();
    }
    function frame(now){
      const dt=Math.min(now-last,50);last=now;t+=dt*.001;
      const st=stateRef.current;
      ctx.clearRect(0,0,W,H);
      const pulse=st==="idle"?.4+Math.sin(t*.5)*.1:.88+Math.sin(t*1.1)*.12;
      const r=st==="idle"?13:14+Math.sin(t*1.4)*1;
      if(st==="listening")drawListening(r,pulse,dt);
      else if(st==="speaking")drawSpeaking(r,pulse);
      else if(st==="thinking")drawThinking(r,pulse);
      else drawIdle(r);
      drawSphere(r,pulse,st);
      // ── EMBER DRAW ─────────────────────────────────────────
      const dt2=Math.min(dt,50)/1000;
      const emberSpeed = st==="idle"?.5:st==="speaking"?1.6:st==="thinking"?1.2:1.0;
      embers.forEach(e=>{
        e.life+=dt2*emberSpeed;
        if(e.life>=e.maxLife){
          const ne=makeEmber(e.layer);
          Object.assign(e,ne);
          return;
        }
        e.vx+=e.ax; e.vx*=.97; e.vy*=.975;
        e.x+=e.vx; e.y+=e.vy;
        const prog=e.life/e.maxLife;
        // fade in fast, fade out slow
        const fadeIn=Math.min(1,prog*6);
        const fadeOut=1-Math.pow(prog,2);
        const baseAlpha=(st==="idle"?.45:.85)*fadeIn*fadeOut;
        if(baseAlpha<.015)return;
        const sz=e.size*(1-prog*.55);
        if(sz<.2)return;

        ctx.save();
        ctx.globalAlpha=baseAlpha;

        if(e.warm){
          // Amber ember: white-hot core → orange → transparent
          const wh=Math.max(0,1-prog*2.5);
          const rVal=255, gVal=Math.floor(100+wh*155+prog*40), bVal=Math.floor(wh*60);
          // Outer glow
          const grd=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,sz*3.5);
          grd.addColorStop(0,`rgba(${rVal},${gVal},${bVal},0.9)`);
          grd.addColorStop(.4,`rgba(255,${Math.floor(gVal*.7)},0,0.4)`);
          grd.addColorStop(1,`rgba(255,80,0,0)`);
          ctx.beginPath(); ctx.arc(e.x,e.y,sz*3.5,0,Math.PI*2);
          ctx.fillStyle=grd; ctx.fill();
          // Core dot
          ctx.beginPath(); ctx.arc(e.x,e.y,sz,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,${gVal},${bVal},1)`;
          ctx.shadowBlur=sz*6; ctx.shadowColor=`rgba(255,140,40,0.9)`;
          ctx.fill(); ctx.shadowBlur=0;
        } else {
          // Presence color wisp
          const [pr,pg,pb]=C.primary;
          const grd=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,sz*4);
          grd.addColorStop(0,`rgba(${pr},${pg},${pb},0.85)`);
          grd.addColorStop(.35,`rgba(${pr},${pg},${pb},0.3)`);
          grd.addColorStop(1,`rgba(${pr},${pg},${pb},0)`);
          ctx.beginPath(); ctx.arc(e.x,e.y,sz*4,0,Math.PI*2);
          ctx.fillStyle=grd; ctx.fill();
          // Core
          ctx.beginPath(); ctx.arc(e.x,e.y,sz*.7,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,255,255,0.9)`;
          ctx.shadowBlur=sz*8; ctx.shadowColor=C.hex;
          ctx.fill(); ctx.shadowBlur=0;
        }
        ctx.restore();
      });

      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    return()=>cancelAnimationFrame(raf);
  },[size]);
  return <canvas ref={canvasRef} className="presence-sphere-canvas" />;
}

// ═══════════════════════════════════════════════
//  NUCLEUS — centro visual com fogo real
// ═══════════════════════════════════════════════
function Nucleus({ state = "listening", presence = "atlas" }) {
  const canvasRef = React.useRef(null);
  const stateRef = React.useRef(state);
  const presRef = React.useRef(presence);
  React.useEffect(()=>{stateRef.current=state;},[state]);
  React.useEffect(()=>{presRef.current=presence;},[presence]);

  React.useEffect(()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    const SIZE = 420;
    const dpr = Math.max(1,window.devicePixelRatio||1);
    canvas.width=SIZE*dpr; canvas.height=SIZE*dpr;
    canvas.style.width=SIZE+"px"; canvas.style.height=SIZE+"px";
    ctx.scale(dpr,dpr);
    const cx=SIZE/2, cy=SIZE/2;

    // ── Color helpers ──────────────────────────────
    function C(){
      return presRef.current==="atlas"
        ? {r:77,g:217,b:255,hex:"#4dd9ff"}
        : {r:180,g:90,b:255,hex:"#b45aff"};
    }

    // ── Orbital rings ──────────────────────────────
    const rings = [
      {radius:55, tilt:0.45, angle:0, speed:0.004, lw:0.9, alpha:0.4, dash:[10,18]},
      {radius:78, tilt:-0.5, angle:1, speed:-0.003, lw:0.7, alpha:0.28, dash:[5,22]},
      {radius:102, tilt:0.65, angle:2, speed:0.002, lw:0.55, alpha:0.2, dash:[4,30]},
      {radius:128, tilt:-0.3, angle:3, speed:-0.0014, lw:0.45, alpha:0.14, dash:[3,38]},
    ];

    // ── Orbital particles ──────────────────────────
    const orbitals = Array.from({length:60},()=>({
      angle: Math.random()*Math.PI*2,
      r: 45+Math.random()*90,
      tilt: (Math.random()-.5)*Math.PI*.55,
      speed: (.003+Math.random()*.005)*(Math.random()>.5?1:-1),
      size: .6+Math.random()*1.6,
      alpha: .25+Math.random()*.65,
      phase: Math.random()*Math.PI*2,
    }));

    // ── Fire embers ────────────────────────────────
    function spawnEmber(){
      const a = Math.random()*Math.PI*2;
      const spawnR = 28+Math.random()*22;
      const speed = .5+Math.random()*.8;
      return {
        x: cx + Math.cos(a)*spawnR,
        y: cy + Math.sin(a)*spawnR,
        vx: Math.cos(a)*speed*(.15+Math.random()*.2) + (Math.random()-.5)*.25,
        vy: Math.sin(a)*speed*(.15+Math.random()*.2) - (.35+Math.random()*.65),
        life: 0,
        maxLife: .35+Math.random()*.55,
        size: .5+Math.random()*.9,
        warm: Math.random()>.35,
      };
    }
    const embers = Array.from({length:32},()=>{
      const e=spawnEmber();
      e.life=Math.random()*e.maxLife;
      return e;
    });

    let t=0, lastT=performance.now(), raf=0;

    function frame(now){
      const dt=Math.min(now-lastT,50); lastT=now; t+=dt*.001;
      const st=stateRef.current;
      const c=C();
      const col=(a)=>`rgba(${c.r},${c.g},${c.b},${a})`;

      ctx.clearRect(0,0,SIZE,SIZE);

      // Pulse
      const pulse = st==="idle" ? .65+Math.sin(t*.5)*.06
        : st==="thinking" ? .88+Math.sin(t*3)*.09
        : st==="speaking" ? 1+Math.sin(t*5)*.13
        : .84+Math.sin(t*1.5)*.08;

      // Aura
      const auraR=160*pulse;
      const aura=ctx.createRadialGradient(cx,cy,0,cx,cy,auraR);
      aura.addColorStop(0,col(.14*pulse));
      aura.addColorStop(.45,col(.06*pulse));
      aura.addColorStop(1,"transparent");
      ctx.beginPath(); ctx.arc(cx,cy,auraR,0,Math.PI*2);
      ctx.fillStyle=aura; ctx.fill();

      // Orbital rings
      const rSpeed = st==="thinking"?2.2:st==="speaking"?1.6:1;
      rings.forEach(ring=>{
        ring.angle+=ring.speed*rSpeed;
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(ring.angle);
        ctx.scale(1,Math.sin(ring.tilt));
        ctx.beginPath();
        ctx.ellipse(0,0,ring.radius*pulse,ring.radius*pulse*.28,0,0,Math.PI*2);
        ctx.strokeStyle=col(ring.alpha*(st==="idle"?.5:1));
        ctx.lineWidth=ring.lw;
        ctx.setLineDash(ring.dash);
        ctx.shadowBlur=10; ctx.shadowColor=c.hex;
        ctx.stroke(); ctx.shadowBlur=0; ctx.setLineDash([]);
        ctx.restore();
      });

      // Orbital particles
      const pSpeed=st==="speaking"?1.9:st==="thinking"?1.5:1;
      orbitals.forEach(p=>{
        p.angle+=p.speed*pSpeed;
        const ox=Math.cos(p.angle)*p.r*pulse;
        const oy=Math.sin(p.angle)*p.r*pulse*Math.abs(Math.sin(p.tilt+t*.08));
        const px=cx+ox, py=cy+oy;
        const fa=p.alpha*(.55+Math.sin(t*2.5+p.phase)*.45)*(st==="idle"?.45:1);
        ctx.beginPath(); ctx.arc(px,py,p.size*pulse,0,Math.PI*2);
        ctx.fillStyle=col(fa);
        ctx.shadowBlur=p.size*5; ctx.shadowColor=c.hex;
        ctx.fill(); ctx.shadowBlur=0;
      });

      // ── FIRE EMBERS ───────────────────────────────
      const eSpeed=st==="idle"?.18:st==="speaking"?.9:st==="thinking"?.6:.38;
      const dtS=dt/1000;
      embers.forEach(e=>{
        e.life+=dtS*eSpeed;
        if(e.life>=e.maxLife){ Object.assign(e,spawnEmber()); return; }
        // Turbulence
        e.vx+=(Math.random()-.5)*.12;
        e.vx*=.93; e.vy*=.955;
        e.x+=e.vx; e.y+=e.vy;
        const prog=e.life/e.maxLife;
        const fadeIn=Math.min(1,prog*8);
        const fadeOut=Math.pow(1-prog,1.4);
        const alpha=fadeIn*fadeOut*(st==="idle"?.3:.55);
        if(alpha<.02||e.size<.2)return;
        const sz=e.size*(1-prog*.7);
        ctx.save();
        ctx.globalAlpha=alpha;
        if(e.warm){
          // Fire: white core → yellow → orange → red → transparent
          const heat=Math.max(0,1-prog*2.2);
          const rr=255, gg=Math.floor(200-prog*180), bb=Math.floor(heat*80);
          // Outer flame glow
          const fg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,sz*3);
          fg.addColorStop(0,`rgba(255,${gg+40},${bb},0.85)`);
          fg.addColorStop(.4,`rgba(255,${Math.floor(gg*.6)},0,0.3)`);
          fg.addColorStop(1,`rgba(200,40,0,0)`);
          ctx.beginPath(); ctx.arc(e.x,e.y,sz*3,0,Math.PI*2);
          ctx.fillStyle=fg; ctx.fill();
          // Hot core
          ctx.beginPath(); ctx.arc(e.x,e.y,sz,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,${gg+40},${bb},1)`;
          ctx.shadowBlur=sz*7; ctx.shadowColor=`rgba(255,${gg},0,1)`;
          ctx.fill(); ctx.shadowBlur=0;
        } else {
          // Presence color wisp
          const fg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,sz*3);
          fg.addColorStop(0,`rgba(${c.r},${c.g},${c.b},0.7)`);
          fg.addColorStop(.4,`rgba(${c.r},${c.g},${c.b},0.2)`);
          fg.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
          ctx.beginPath(); ctx.arc(e.x,e.y,sz*3,0,Math.PI*2);
          ctx.fillStyle=fg; ctx.fill();
          // White core
          ctx.beginPath(); ctx.arc(e.x,e.y,sz*.65,0,Math.PI*2);
          ctx.fillStyle="rgba(255,255,255,0.95)";
          ctx.shadowBlur=sz*9; ctx.shadowColor=c.hex;
          ctx.fill(); ctx.shadowBlur=0;
        }
        ctx.restore();
      });

      // ── CORE SPHERE ───────────────────────────────
      const coreR=(st==="idle"?24:st==="thinking"?30:34)*pulse;
      const sg=ctx.createRadialGradient(cx-coreR*.32,cy-coreR*.32,1,cx,cy,coreR);
      sg.addColorStop(0,"rgba(255,255,255,1)");
      sg.addColorStop(.18,"rgba(220,235,255,.97)");
      sg.addColorStop(.52,col(1));
      sg.addColorStop(.84,"rgba(10,15,60,.92)");
      sg.addColorStop(1,"rgba(2,4,16,.85)");
      ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2);
      ctx.fillStyle=sg;
      ctx.shadowBlur=st==="speaking"?50:st==="idle"?12:26;
      ctx.shadowColor=c.hex;
      ctx.fill(); ctx.shadowBlur=0;
      // Highlight
      const hl=ctx.createRadialGradient(cx-coreR*.4,cy-coreR*.4,0,cx-coreR*.4,cy-coreR*.4,coreR*.55);
      hl.addColorStop(0,"rgba(255,255,255,.88)"); hl.addColorStop(1,"transparent");
      ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2);
      ctx.fillStyle=hl; ctx.fill();

      // Speaking burst
      if(st==="speaking"){
        for(let i=0;i<22;i++){
          const a=(i/22)*Math.PI*2+Math.sin(t*7+i*.6)*.18;
          const len=coreR+18+Math.sin(t*5+i*1.2)*14;
          const inten=.45+Math.sin(t*4+i*.5)*.4;
          const g2=ctx.createLinearGradient(cx+Math.cos(a)*coreR,cy+Math.sin(a)*coreR,cx+Math.cos(a)*len,cy+Math.sin(a)*len);
          g2.addColorStop(0,col(.85*inten)); g2.addColorStop(1,col(0));
          ctx.beginPath();
          ctx.moveTo(cx+Math.cos(a)*coreR,cy+Math.sin(a)*coreR);
          ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
          ctx.strokeStyle=g2; ctx.lineWidth=1.2+Math.sin(t*3+i)*.5;
          ctx.shadowBlur=6; ctx.shadowColor=c.hex;
          ctx.stroke(); ctx.shadowBlur=0;
        }
      }

      // Thinking scan arc
      if(st==="thinking"){
        const sa=t*2.8;
        ctx.beginPath(); ctx.arc(cx,cy,coreR+28,sa,sa+Math.PI*.75);
        ctx.strokeStyle=`rgba(192,132,252,${.75*pulse})`;
        ctx.lineWidth=1.6; ctx.shadowBlur=10; ctx.shadowColor="#c084fc";
        ctx.stroke(); ctx.shadowBlur=0;
        ctx.beginPath(); ctx.arc(cx+Math.cos(sa)*(coreR+28),cy+Math.sin(sa)*(coreR+28),3.5,0,Math.PI*2);
        ctx.fillStyle="#c084fc"; ctx.shadowBlur=10; ctx.shadowColor="#c084fc";
        ctx.fill(); ctx.shadowBlur=0;
      }

      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    return()=>cancelAnimationFrame(raf);
  },[]);

  return <canvas ref={canvasRef} className="nucleus-canvas" />;
}

function Waveform({ active=true }){
  const bars=56;
  return(
    <div className={`waveform ${active?"is-active":""}`}>
      {Array.from({length:bars}).map((_,i)=>(
        <span key={i} className="wf-bar" style={{"--i":i,"--n":bars,animationDelay:`${(i*.04)%1.6}s`}} />

  );
}

// ═══════════════════════════════════════════════
//  TWEAKS (simplified — sem protocolo de host)
// ═══════════════════════════════════════════════
function useTweaks(defaults){
  const [values,setValues]=React.useState(defaults);
  const setTweak=React.useCallback((key,val)=>setValues(p=>({...p,[key]:val})),[]);
  return [values,setTweak];
}

function TweaksPanel({title="Tweaks",children}){
  const [open,setOpen]=React.useState(false);
  return(
    <>
      {!open&&<button style={{position:"fixed",right:16,bottom:16,zIndex:9999,background:"rgba(10,28,60,.85)",border:"1px solid rgba(77,217,255,.4)",color:"#4dd9ff",fontFamily:"'Orbitron',sans-serif",fontSize:9,letterSpacing:".2em",padding:"8px 14px",borderRadius:6,cursor:"pointer"}} onClick={()=>setOpen(true)}>TWEAKS</button>}
      {open&&(
        <div className="twk-panel">
          <div className="twk-hd">
            <b>{title}</b>
            <button className="twk-x" onClick={()=>setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      )}
    </>
  );
}
function TweakSection({label}){return <div className="twk-sect">{label}</div>}
function TweakSlider({label,value,min=0,max=100,step=1,unit="",onChange}){
  return(
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span><span className="twk-val">{value}{unit}</span></div>
      <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))}/>
    </div>
  );
}
function TweakToggle({label,value,onChange}){
  return(
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value?"1":"0"} onClick={()=>onChange(!value)}><i/></button>
    </div>
  );
}
function TweakRadio({label,value,options,onChange}){
  const opts=options.map(o=>typeof o==="object"?o:{value:o,label:o});
  const idx=Math.max(0,opts.findIndex(o=>o.value===value));
  const n=opts.length;
  return(
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{left:`calc(2px + ${idx}*(100% - 4px)/${n})`,width:`calc((100% - 4px)/${n})`}}/>
        {opts.map(o=><button key={o.value} type="button" onClick={()=>onChange(o.value)}>{o.label}</button>)}
      </div>
    </div>
  );
}
function TweakSelect({label,value,options,onChange}){
  return(
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <select className="twk-field" value={value} onChange={e=>onChange(e.target.value)}>
        {options.map(o=>{const v=typeof o==="object"?o.value:o;const l=typeof o==="object"?o.label:o;return<option key={v} value={v}>{l}</option>})}
      </select>
    </div>
  );
}

// ═══════════════════════════════════════════════
//  APP PRINCIPAL
// ═══════════════════════════════════════════════
const TWEAK_DEFAULTS = {
  intensity:1, presenceColor:"cyan-amber", showHud:true,
  voiceMode:"listening", nebulaVariant:"blue-violet", showWaveform:true,
};

function App(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [now,setNow]=React.useState(new Date());
  const [sessao,setSessao]=React.useState({uptime:"00:00",mensagens_atlas:0,mensagens_lyra:0});
  const [latencia,setLatencia]=React.useState("--");
  const [ouvindoVoz,setOuvindoVoz]=React.useState(false);
  const [chat,setChat]=React.useState("");
  const [messages,setMessages]=React.useState([
    {from:"atlas",text:"Boa noite. Estou ouvindo."},
  ]);
  const [thinking,setThinking]=React.useState(false);
  const [presence,setPresence]=React.useState("atlas");
  const [alarmeAtivo,setAlarmeAtivo]=React.useState(null);
  const [voiceEnabled,setVoiceEnabled]=React.useState(true);
  const [screensaver,setScreensaver]=React.useState(false);
  const [histOpen,setHistOpen]=React.useState(false);
  const histEndRef=React.useRef(null);
  const ssTimer=React.useRef(null);
  const inputRef=React.useRef(null);

  const resetSsTimer=React.useCallback(()=>{
    if(ssTimer.current)clearTimeout(ssTimer.current);
    setScreensaver(false);
    ssTimer.current=setTimeout(()=>setScreensaver(true),30000);
  },[]);

  React.useEffect(()=>{
    if(histOpen&&histEndRef.current)histEndRef.current.scrollIntoView({behavior:"smooth"});
  },[histOpen,messages]);

  React.useEffect(()=>{
    resetSsTimer();
    const events=["mousemove","mousedown","keydown","touchstart","wheel"];
    events.forEach(e=>window.addEventListener(e,resetSsTimer,{passive:true}));
    return()=>{
      if(ssTimer.current)clearTimeout(ssTimer.current);
      events.forEach(e=>window.removeEventListener(e,resetSsTimer));
    };
  },[resetSsTimer]);

  React.useEffect(()=>{
    const id=setInterval(()=>setNow(new Date()),1000);
    return()=>clearInterval(id);
  },[]);

  React.useEffect(()=>{
    // Puxa dados de sessão do backend a cada 5s
    const fetchSessao=async()=>{
      try{
        const res=await fetch("http://127.0.0.1:8000/sessao");
        if(res.ok){ const d=await res.json(); setSessao(d); }
      }catch(e){}
    };
    fetchSessao();
    const id=setInterval(fetchSessao,5000);
    return()=>clearInterval(id);
  },[]);

  // Ref para ler voiceMode atual dentro do setInterval sem closure stale
  const tRef=React.useRef(t);
  React.useEffect(()=>{ tRef.current=t; },[t]);

  // Ref para ler alarmeAtivo atual dentro do setInterval sem closure stale
  const alarmeAtivoRef=React.useRef(null);
  React.useEffect(()=>{ alarmeAtivoRef.current=alarmeAtivo; },[alarmeAtivo]);
  const voiceEnabledRef=React.useRef(true);
  React.useEffect(()=>{ voiceEnabledRef.current=voiceEnabled; },[voiceEnabled]);
  const presenceRef=React.useRef(presence);
  React.useEffect(()=>{ presenceRef.current=presence; },[presence]);

  React.useEffect(()=>{
    const verificar=async()=>{
      try{
        const res=await fetch("http://127.0.0.1:8000/alarmes/verificar",{method:"POST"});
        if(!res.ok)return;
        const data=await res.json();
        for(const alarme of (data.disparados||[])){
          const hm=String(alarme.horario||"").slice(11,16);
          const texto=`JP, são ${hm}. ${alarme.mensagem}.`;
          setMessages(m=>[...m,{from:presenceRef.current,text:texto}]);
          if(voiceEnabledRef.current&&tRef.current.voiceMode!=="idle"){
            fetch("http://127.0.0.1:8000/voz/falar",{
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({texto,presence:presenceRef.current}),
            }).catch(()=>{});
          }
          if(!alarmeAtivoRef.current) setAlarmeAtivo(alarme);
        }
      }catch(e){}
      try{
        const resL=await fetch("http://127.0.0.1:8000/lembretes/verificar",{method:"POST"});
        if(!resL.ok)return;
        const dataL=await resL.json();
        if(!dataL.disparados||!dataL.disparados.length)return;
        for(const lembrete of dataL.disparados){
          const texto=`Lembrete: ${lembrete.mensagem} — prioridade ${lembrete.prioridade}`;
          setMessages(m=>[...m,{from:presenceRef.current,text:texto}]);
          if(voiceEnabledRef.current&&tRef.current.voiceMode!=="idle"){
            fetch("http://127.0.0.1:8000/voz/falar",{
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({texto,presence:presenceRef.current}),
            }).catch(()=>{});
          }
        }
      }catch(e){}
    };
    const id=setInterval(verificar,15000);
    return()=>clearInterval(id);
  },[]);

  React.useEffect(()=>{
    if(!alarmeAtivo)return;
    const hm=String(alarmeAtivo.horario||"").slice(11,16);
    const msg=alarmeAtivo.mensagem||"Alarme";
    const frases=[
      ()=>`JP, ainda esperando. São ${hm}.`,
      ()=>`JP, hora de acordar. ${msg}.`,
      ()=>`JP, ${hm}. Você pediu para acordar.`,
    ];
    const id=setInterval(()=>{
      const texto=frases[Math.floor(Math.random()*frases.length)]();
      setMessages(m=>[...m,{from:presenceRef.current,text:texto}]);
      if(voiceEnabledRef.current&&tRef.current.voiceMode!=="idle"){
        fetch("http://127.0.0.1:8000/voz/falar",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({texto,presence:presenceRef.current}),
        }).catch(()=>{});
      }
    },20000);
    return()=>clearInterval(id);
  },[alarmeAtivo]);

  const _CONFIRMA=/acordei|pode parar|cancelar|entendido|\bsim\b|\bok\b|\bpronto\b/i;

  const send=async()=>{
    const v=chat.trim();
    if(!v)return;
    const from=presence;
    setMessages(m=>[...m,{from:"you",text:v}]);
    setChat("");
    if(alarmeAtivo&&_CONFIRMA.test(v)){
      setAlarmeAtivo(null);
      const despedida="Alarme encerrado. Bom dia, JP.";
      setMessages(m=>[...m,{from:presence,text:despedida}]);
      if(voiceEnabled){
        fetch("http://127.0.0.1:8000/voz/falar",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({texto:despedida,presence}),
        }).catch(()=>{});
      }
      return;
    }
    // Núcleo → PROCESSANDO
    setThinking(true);
    setTweak("voiceMode","thinking");
    try {
      const res=await fetch(`http://127.0.0.1:8000/chat/${from}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({texto:v}),
      });
      if(!res.ok) throw new Error("API error");
      const data=await res.json();
      // alarme_criado != null → confirmação já embutida em data.resposta; sem msg extra
      setMessages(m=>[...m,{from,text:data.resposta}]);
      if(voiceEnabledRef.current){
        fetch("http://127.0.0.1:8000/voz/falar",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({texto:data.resposta,presence:from}),
        }).catch(()=>{});
      }
      if(data.latencia_ms!==undefined) setLatencia(data.latencia_ms);
      // Núcleo → FALANDO por 2s, depois OUVINDO
      setTweak("voiceMode","speaking");
      setTimeout(()=>setTweak("voiceMode","listening"), 2000);
    } catch(e){
      setMessages(m=>[...m,{from,text:"[Sem conexão com o servidor. Rode: uvicorn api:app --port 8000]"}]);
      setTweak("voiceMode","listening");
    } finally {
      setThinking(false);
    }
  };

  const onKey=(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}};

  const ativarVoz=async()=>{
    if(ouvindoVoz)return;
    setOuvindoVoz(true);
    setTweak("voiceMode","listening");
    try{
      const res=await fetch("http://127.0.0.1:8000/voz/ouvir",{method:"POST"});
      const data=await res.json();
      if(data.status==="ok"&&data.texto){
        setChat(data.texto);
        // Auto-envia após captura
        setTimeout(()=>{
          setMessages(m=>[...m,{from:"you",text:data.texto}]);
          setChat("");
          setThinking(true);
          setTweak("voiceMode","thinking");
          fetch(`http://127.0.0.1:8000/chat/${presence}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({texto:data.texto}),
          }).then(r=>r.json()).then(d=>{
            setMessages(m=>[...m,{from:presence,text:d.resposta}]);
            if(voiceEnabledRef.current){
              fetch("http://127.0.0.1:8000/voz/falar",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({texto:d.resposta,presence}),
              }).catch(()=>{});
            }
            if(d.latencia_ms!==undefined)setLatencia(d.latencia_ms);
            setTweak("voiceMode","speaking");
            setTimeout(()=>setTweak("voiceMode","listening"),2000);
          }).catch(()=>{
            setMessages(m=>[...m,{from:presence,text:"[Erro na resposta]"}]);
            setTweak("voiceMode","listening");
          }).finally(()=>setThinking(false));
        },100);
      }
    }catch(e){
      console.error("Voz erro:",e);
    }finally{
      setOuvindoVoz(false);
    }
  };

  const hh=String(now.getHours()).padStart(2,"0");
  const mm=String(now.getMinutes()).padStart(2,"0");
  const ss=String(now.getSeconds()).padStart(2,"0");
  const dateStr=now.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});

  const voiceState=thinking?"thinking":t.voiceMode;
  const presenceLabel={listening:"OUVINDO",speaking:"FALANDO",idle:"EM ESPERA",thinking:"PROCESSANDO"}[voiceState];

  return(
    <div className={`app${histOpen?" hist-open":""}`}>
      <Nebula variant={t.nebulaVariant}/>
      {t.showHud&&<HudFrame/>}

      {/* SCREENSAVER */}
      <div className={`screensaver-overlay${screensaver?" active":""}`}>
        <Nebula variant={t.nebulaVariant}/>
        <div className="nucleus-wrap">
          <Nucleus state={voiceState} presence={presence}/>
        </div>
        <div className="screensaver-hint">TOQUE PARA CONTINUAR</div>
      </div>

      {/* TOPBAR */}
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">
            <svg viewBox="0 0 32 32" width="22" height="22">
              <circle cx="16" cy="16" r="14" fill="none" stroke={presence==="lyra"?"#b45aff":"#4dd9ff"} strokeWidth="1" opacity=".6"/>
              <circle cx="16" cy="16" r="9" fill="none" stroke={presence==="lyra"?"#b45aff":"#4dd9ff"} strokeWidth="1"/>
              <circle cx="16" cy="16" r="3" fill={presence==="lyra"?"#d4a0ff":"#9eeaff"}/>
              <line x1="16" y1="2" x2="16" y2="8" stroke={presence==="lyra"?"#b45aff":"#4dd9ff"} strokeWidth="1"/>
              <line x1="16" y1="24" x2="16" y2="30" stroke={presence==="lyra"?"#b45aff":"#4dd9ff"} strokeWidth="1"/>
            </svg>
          </div>
          <div className="brand-text">
            <h1 className={presence==="lyra"?"lyra-title":""}>{presence==="lyra"?"LYRA":"ATLAS"}</h1>
            <p>{presence==="lyra"?"VOICE · LYRA-3":"VOICE · v3.2"}</p>
          </div>
        </div>

        <div className="clock">
          <div className="clock-time">
            <span className="hh">{hh}</span>
            <span className="colon">:</span>
            <span className="mm">{mm}</span>
            <span className="ss">{ss}</span>
          </div>
          <div className="clock-date">{dateStr.toUpperCase()}</div>
        </div>

        <button className="presence-btn" onClick={()=>setPresence(p=>p==="atlas"?"lyra":"atlas")}>
          <span className="presence-btn-dot" style={{background:presence==="lyra"?"#b45aff":"var(--amber)",boxShadow:`0 0 10px ${presence==="lyra"?"#b45aff":"var(--amber)"}`}}/>
          <span className="presence-btn-text">TROCAR PRESENÇA</span>
          <span className="presence-btn-chev">›</span>
        </button>
      </header>

      {/* PAINEL ESQUERDO */}
      <aside className="side side--left">
        <SideStat label="LATÊNCIA" value={latencia} unit="ms"/>
        <SideStat label="SINAL" value="98" unit="%"/>
        <SideStat label="MODELO" value={presence==="atlas"?"ATLAS-7":"LYRA-3"}/>
        <div className="side-divider"/>
        <div className="side-channel">
          <div className="side-channel-label">CANAL</div>
          <div className="side-channel-bars">
            {Array.from({length:8}).map((_,i)=>(
              <span key={i} className="ch-bar" style={{"--i":i}}/>
            ))}
          </div>
        </div>
      </aside>

      {/* PAINEL DIREITO */}
      <aside className="side side--right">
        <div className="presence-status">
          <div className="presence-status-label" style={{color:presence==="lyra"?"var(--lyra-bright)":"var(--cyan-bright)"}}>{presenceLabel}</div>
          <div className="presence-name">
            <button type="button" className={`pname-btn ${presence==="atlas"?"active-atlas":""}`} onClick={()=>setPresence("atlas")}>ATLAS</button>
            <div className="pname-divider"/>
            <button type="button" className={`pname-btn ${presence==="lyra"?"active-lyra":""}`} onClick={()=>setPresence("lyra")}>LYRA</button>
          </div>
        </div>
        <div className="side-divider"/>
        <SideStat label="MEMÓRIA" value="14" unit="MB"/>
        <SideStat label="CONTEXTO" value={presence==="atlas"?sessao.mensagens_atlas:sessao.mensagens_lyra} unit="msg"/>
        <SideStat label="SESSÃO" value={sessao.uptime}/>
      </aside>

      {/* STAGE CENTRAL — NÚCLEO */}
      <main className="stage">
        <div className="nucleus-wrap">
          <Nucleus state={voiceState} presence={presence}/>
        </div>
        {t.showWaveform&&<Waveform active={!thinking&&t.voiceMode==="listening"}/>}
      </main>

      {/* TRANSCRIPT */}
      <div className="transcript">
        {messages.slice(-3).map((m,i)=>(
          <div key={i} className={`msg msg--${m.from}`}>
            <span className="msg-tag">{m.from==="you"?"VOCÊ":m.from.toUpperCase()}</span>
            <span className="msg-text">{m.text}</span>
          </div>
        ))}
        {thinking&&(
          <div className="msg msg--atlas msg--thinking">
            <span className="msg-tag">{presence.toUpperCase()}</span>
            <span className="msg-text"><span className="dot-pulse"><i/><i/><i/></span></span>
          </div>
        )}
      </div>

      {/* DOCK */}
      <footer className="dock">
        <div className="dock-frame">
          <button className="dock-icon" title="Voz" onClick={ativarVoz}
            style={{background:ouvindoVoz?"rgba(77,217,255,.25)":"",borderColor:ouvindoVoz?"var(--cyan)":"",boxShadow:ouvindoVoz?"0 0 20px rgba(77,217,255,.6)":""}}>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke={ouvindoVoz?"#4dd9ff":"currentColor"} strokeWidth="1.5" strokeLinecap="round">
              <rect x="9" y="3" width="6" height="12" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
          </button>
          <button className="dock-icon" title={voiceEnabled?"Silenciar áudio":"Ativar áudio"} onClick={()=>setVoiceEnabled(v=>!v)}
            style={{background:!voiceEnabled?"rgba(255,80,80,.15)":"",borderColor:!voiceEnabled?"rgba(255,80,80,.55)":"",boxShadow:!voiceEnabled?"0 0 14px rgba(255,80,80,.35)":""}}>
            <span style={{fontSize:16,lineHeight:1,userSelect:"none"}}>{voiceEnabled?"🔊":"🔇"}</span>
          </button>
          <span className="dock-prompt" style={{color:thinking?presence==="lyra"?"var(--lyra)":"var(--cyan)":"var(--cyan)"}}>›</span>
          {thinking
            ? <div className="dock-typing"><span/><span/><span/></div>
            : <input ref={inputRef} className="dock-input"
                placeholder={`Fale com ${presence==="lyra"?"a Lyra":"o Atlas"}…`}
                value={chat} onChange={e=>setChat(e.target.value)} onKeyDown={onKey} autoFocus/>
          }
          <div className="dock-meta">
            <span className="dock-counter">{chat.length}/2000</span>
          </div>
          <button className="dock-send" onClick={send} disabled={!chat.trim()}>
            <span>ENVIAR</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
        <div className="dock-hint">
          <span><kbd>↵</kbd> enviar</span>
          <span><kbd>⌘</kbd>+<kbd>K</kbd> comandos</span>
          <span><kbd>␣</kbd> ativar voz</span>
        </div>
      </footer>

      {/* HISTÓRICO */}
      <div className={`hist-panel${histOpen?" open":""}`}>
        <div className="hist-header">
          <span className="hist-title">HISTÓRICO DA SESSÃO</span>
          <button className="hist-close" onClick={()=>setHistOpen(false)}>✕</button>
        </div>
        <div className="hist-messages">
          {messages.map((m,i)=>(
            <div key={i} className={`hist-msg hist-msg--${m.from}`}>
              <div className="hist-msg-tag">{m.from==="you"?"VOCÊ":m.from.toUpperCase()}</div>
              <div className="hist-msg-text">{m.text}</div>
            </div>
          ))}
          <div ref={histEndRef}/>
        </div>
        <div className="hist-footer">
          <span className="hist-count">{messages.length} MENSAGEM{messages.length!==1?"S":""} NESTA SESSÃO</span>
        </div>
      </div>

      {/* BOTÃO HISTÓRICO */}
      <button className={`hist-btn${histOpen?" open":""}`} onClick={()=>setHistOpen(h=>!h)}>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        HISTÓRICO
      </button>

      {/* TWEAKS */}
      <TweaksPanel title="Atlas · Tweaks">
        <TweakSection label="Presença"/>
        <TweakSlider label="Intensidade" value={t.intensity} min={.4} max={1.5} step={.05} onChange={v=>setTweak("intensity",v)}/>
        <TweakRadio label="Estado" value={t.voiceMode}
          options={[{value:"listening",label:"Ouvir"},{value:"speaking",label:"Falar"},{value:"idle",label:"Esperar"}]}
          onChange={v=>setTweak("voiceMode",v)}/>
        <TweakSection label="Cena"/>
        <TweakSelect label="Nebulosa" value={t.nebulaVariant}
          options={[{value:"blue-violet",label:"Azul · Violeta"},{value:"deep-blue",label:"Azul Profundo"}]}
          onChange={v=>setTweak("nebulaVariant",v)}/>
        <TweakToggle label="Moldura HUD" value={t.showHud} onChange={v=>setTweak("showHud",v)}/>
        <TweakToggle label="Forma de onda" value={t.showWaveform} onChange={v=>setTweak("showWaveform",v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
